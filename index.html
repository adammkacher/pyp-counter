<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inequalities in Sports</title>
  <style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg, #001f3f, #003366, #00aa88, #001f3f);
  background-size: 400% 400%;
  animation: gradient 10s ease infinite;
}
@keyframes gradient {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
h1 {
  font-size: 140px;
  margin: 0;
  color: #00ff99;
  text-shadow: 0 0 10px #00ff99, 0 0 20px #00ff99, 0 0 40px #00ff99, 0 0 80px #00ff99;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}
p { font-size: 30px; margin-top: 10px; margin-bottom: 20px; }
.progress-container {
  width: 400px; height: 25px;
  background: rgba(255,255,255,0.2);
  border-radius: 20px; overflow: hidden; margin-top: 10px;
}
#progress-bar {
  width: 0%; height: 100%;
  background: linear-gradient(to right, #00ff99, #00ccff);
  transition: width 0.3s;
}
.buttons { display: flex; gap: 20px; margin-top: 20px; }
button {
  padding: 18px 40px; font-size: 28px; border-radius: 25px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px); color: white; cursor: pointer;
  transition: 0.3s; box-shadow: 0 0 20px rgba(0,255,153,0.5);
}
button:hover { transform: scale(1.1); box-shadow: 0 0 40px rgba(0,255,153,1); }
.flash {
  position: absolute; top: 60px; font-size: 40px; color: #00ff99;
  animation: float 1s ease forwards;
}
@keyframes float {
  0%   { opacity: 1; transform: translateY(20px); }
  100% { opacity: 0; transform: translateY(-40px); }
}
.circle {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  animation: move 15s linear infinite;
}
@keyframes move {
  from { transform: translateY(100vh); }
  to   { transform: translateY(-120vh); }
}
.light {
  position: absolute; top: -20%; left: -30%; width: 60%; height: 160%;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.12), rgba(255,255,255,0));
  transform: rotate(20deg); animation: sweep 6s linear infinite; pointer-events: none;
}
@keyframes sweep {
  0%   { left: -50%; }
  100% { left: 120%; }
}
.ring {
  position: absolute; border: 4px solid #00ff99; border-radius: 50%;
  animation: explode 0.8s ease-out forwards; pointer-events: none;
}
@keyframes explode {
  0%   { width: 20px; height: 20px; opacity: 1; }
  100% { width: 300px; height: 300px; opacity: 0; }
}
.bigFlash {
  position: absolute; left: 50%; top: 40%;
  transform: translate(-50%, -50%);
  font-size: 70px; font-weight: bold;
  color: rgba(255,255,255,0.15);
  animation: giantFlash 1s ease; pointer-events: none;
}
@keyframes giantFlash {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  50%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
}
.confetti {
  position: absolute; width: 12px; height: 12px;
  background: white; top: -20px;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
  </style>
</head>
<body>
  <div id="flash-container"></div>
  <h1 id="counter">000</h1>
  <p>People learned about inequalities in sports through our exhibition</p>
  <div class="progress-container">
    <div id="progress-bar"></div>
  </div>
  <div class="buttons">
    <button onclick="increase()">+1</button>
    <button onclick="decrease()">-1</button>
  </div>
  <div class="light"></div>

  <script>
let count = 0;

function increase() {
  count++;
  updateCounter("+1 Awareness Spread");
}

function decrease() {
  if (count > 0) {
    count--;
    updateCounter("-1");
  }
}

function updateCounter(message) {
  const counter = document.getElementById("counter");
  counter.innerText = count.toString().padStart(3, '0');
  counter.style.transform = "scale(1.15)";
  setTimeout(() => { counter.style.transform = "scale(1)"; }, 200);

  const flash = document.createElement("div");
  flash.className = "flash";
  flash.innerText = message;
  document.body.appendChild(flash);
  setTimeout(() => { flash.remove(); }, 1000);

  const progress = Math.min((count / 100) * 100, 100);
  document.getElementById("progress-bar").style.width = progress + "%";

  document.body.style.transform = "translateX(5px)";
  setTimeout(() => { document.body.style.transform = "translateX(-5px)"; }, 50);
  setTimeout(() => { document.body.style.transform = "translateX(0px)"; }, 100);

  const ring = document.createElement("div");
  ring.className = "ring";
  ring.style.left = (window.innerWidth / 2 - 150) + "px";
  ring.style.top  = (window.innerHeight / 2 - 150) + "px";
  document.body.appendChild(ring);
  setTimeout(() => { ring.remove(); }, 800);

  const big = document.createElement("div");
  big.className = "bigFlash";
  big.innerText = "AWARENESS SPREAD";
  document.body.appendChild(big);
  setTimeout(() => { big.remove(); }, 1000);

  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * window.innerWidth + "px";
    confetti.style.background = ["#00ff99","#00ccff","#ffffff"][Math.floor(Math.random()*3)];
    confetti.style.animationDuration = (2 + Math.random() * 3) + "s";
    const sz = (8 + Math.random() * 10) + "px";
    confetti.style.width = sz;
    confetti.style.height = sz;
    document.body.appendChild(confetti);
    setTimeout(() => { confetti.remove(); }, 5000);
  }
}

for (let i = 0; i < 20; i++) {
  const circle = document.createElement("div");
  circle.classList.add("circle");
  const size = Math.random() * 60;
  circle.style.width  = size + "px";
  circle.style.height = size + "px";
  circle.style.left   = Math.random() * 100 + "vw";
  circle.style.animationDuration = (10 + Math.random() * 10) + "s";
  document.body.appendChild(circle);
}
  </script>
</body>
</html>
